name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  lint:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: php-cs-fixer
      - run: composer update --no-progress --no-interaction --no-scripts --ignore-platform-reqs
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: phpstan
      - run: composer update --no-progress --no-interaction --no-scripts --ignore-platform-reqs
      - run: vendor/bin/phpstan analyse --configuration=phpstan.neon

  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
      - run: composer update --no-progress --no-interaction --no-scripts --ignore-platform-reqs
      - run: vendor/bin/phpunit --coverage-clover=coverage.xml
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer update --no-progress --no-interaction --no-scripts --ignore-platform-reqs
      - run: composer audit
